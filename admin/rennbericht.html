<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rennbericht · Darkline Admin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="stylesheet" href="/assets/fonts.css">
<link rel="stylesheet" href="/assets/site.css">
<style>
.team{min-height:calc(100vh - 68px);padding-block:clamp(48px,7vw,88px) 96px}
.team .doc-head{margin-bottom:40px}
.gate{max-width:560px;background:var(--paper);padding:clamp(24px,4vw,40px);border-left:4px solid var(--red)}
.gate h2{font-size:clamp(1.6rem,3.6vw,2.4rem);margin-bottom:14px}
.gate p{margin:0 0 24px;color:#c4cbc8}
.gate .err{margin:0 0 24px;padding:12px 14px;background:rgba(211,18,27,.14);border-left:3px solid var(--red);color:var(--ink)}
.gate button{border:0;cursor:pointer}
.msg{padding:16px 18px;background:var(--paper);color:#c4cbc8;border-left:3px solid var(--rule)}
.msg.err{border-left-color:var(--red)}
.wb-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px}
.wb-kpi{background:var(--paper);padding:16px 18px;display:grid;gap:6px}
.wb-kpi b{font:900 clamp(1.4rem,3vw,2rem)/1 var(--f-wide);font-variation-settings:"wdth" 110}
.wb-kpi .delta{font:500 .7rem/1 var(--f-mono);color:var(--muted)}
.rb-controls{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,2fr);gap:10px;margin-bottom:18px}
.rb-controls label{display:grid;gap:6px;min-width:0}
.rb-controls select,.rb-controls input,.rb-draft input,.rb-draft textarea{width:100%;min-width:0;padding:11px 12px;background:var(--paper);border:0;border-bottom:2px solid var(--rule);color:var(--ink);font:500 .86rem/1.4 var(--f-mono);color-scheme:dark}
.rb-controls :focus,.rb-draft :focus{outline:none;border-bottom-color:var(--red)}
.rb-controls :disabled{opacity:.5}
.rb-card{background:var(--paper);padding:14px 0 10px;margin-top:16px}
.rb-card h4{margin:0 16px 10px;font:500 .7rem/1.3 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.rb-card .scroll{overflow-x:auto}
.rb-card table{width:100%;border-collapse:collapse;font:500 .84rem/1.3 var(--f-mono)}
.rb-card th{text-align:left;font-weight:500;font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:6px 16px}
.rb-card td{padding:8px 16px;border-top:1px solid #1b1f21;white-space:nowrap}
.rb-card th.num,.rb-card td.num{text-align:right}
.rb-card td.rb-name{font-family:var(--f-wide);font-weight:700}
.rb-draft{display:grid;gap:10px;margin-top:16px;background:var(--paper);padding:16px}
.rb-draft label{display:grid;gap:6px}
.rb-draft textarea{min-height:420px;resize:vertical;line-height:1.55}
.rb-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.rb-actions .lbl{margin-left:auto}
.rb-btn{padding:11px 16px;background:var(--red);border:0;cursor:pointer;font:700 .78rem/1 var(--f-wide);font-variation-settings:"wdth" 110;text-transform:uppercase;color:#fff;text-decoration:none}
.rb-btn.rb-ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--phos);color:var(--phos)}
.rb-btn:hover{background:var(--phos);color:var(--black)}
@media (max-width:820px){.rb-controls{grid-template-columns:1fr}.wb-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <a class="logo" href="/" aria-label="Zur Startseite"><img src="/img/brand/logo.webp" alt="Darkline Performance" width="900" height="216"></a>
    <a class="back" href="/admin/">← Zurück zum Admin</a>
  </div>
</header>
<main class="wrap team">
  <div class="doc-head">
    <h1 class="wide" style="margin:0;font-size:clamp(2.4rem,6vw,4.4rem)">Rennbericht</h1>
    <div class="doc-meta lbl">Admin</div>
    <p>Teamrennen aus dem Kalender auswerten (Garage 61) und daraus einen Entwurf für die News erstellen.</p>
  </div>

  <section class="gate" id="rb-login" hidden>
    <h2 class="wide">Anmelden</h2>
    <p class="err" id="rb-login-error" hidden></p>
    <p>Wie im CMS mit GitHub anmelden. Zugang hat, wer auch die Inhalte der Website pflegen darf.</p>
    <button type="button" class="hbtn" id="rb-login-btn">Mit GitHub anmelden →</button>
  </section>

  <section id="rb-app" hidden>
    <div class="rb-controls">
      <label><span class="lbl">Rennen aus dem Kalender</span><select id="rb-race" disabled><option>Lade …</option></select></label>
      <label><span class="lbl">Renntag</span><input type="date" id="rb-date" disabled></label>
      <label><span class="lbl">Session in Garage 61</span><select id="rb-event" disabled></select></label>
    </div>
    <div id="rb-view"></div>
  </section>
</main>
<script src="/assets/rennbericht.js"></script>
</body>
</html>
